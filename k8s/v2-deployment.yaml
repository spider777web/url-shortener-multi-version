apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: url-shortener-v1
  template:
    metadata:
      labels:
        app: url-shortener-v1
    spec:
      containers:
        - name: url-shortener-v1
          image: spider777web/url-shortener:v1
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: url-shortener-v1
spec:
  type: NodePort
  selector:
    app: url-shortener-v1
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30081
